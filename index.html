<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Design & perforation editor</title>
  <style>
    :root {
      --bg: #1a1d23;
      --panel: #252930;
      --text: #e8eaed;
      --muted: #9aa0a6;
      --accent: #3b82f6;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 12px 16px;
      background: var(--panel);
      border-bottom: 1px solid #333;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
    }
    header h1 {
      margin: 0;
      font-size: 1rem;
      font-weight: 600;
    }
    label.file-btn {
      cursor: pointer;
      background: var(--accent);
      color: #fff;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 0.875rem;
    }
    label.file-btn input { display: none; }
    #coords {
      font-family: ui-monospace, monospace;
      font-size: 0.8rem;
      color: var(--muted);
      min-width: 140px;
    }
    #hint {
      font-size: 0.75rem;
      color: var(--muted);
      flex: 1;
      min-width: 200px;
    }
    main {
      flex: 1;
      overflow: auto;
      padding: 16px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }
    .wrap {
      position: relative;
      line-height: 0;
      box-shadow: 0 4px 24px rgba(0,0,0,.4);
    }
    #viewport {
      display: block;
      max-width: 100%;
      height: auto;
      cursor: crosshair;
    }
    .empty-msg {
      padding: 48px;
      text-align: center;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <header>
    <h1>Design & perforation editor</h1>
    <label class="file-btn">
      Upload image
      <input id="file" type="file" accept="image/*" />
    </label>
    <span id="coords">x: — , y: —</span>
    <span id="hint">Drag green corners to resize; drag inside green to move. Teeth stay inside the blue design area.</span>
  </header>
  <main>
    <div id="main-inner">
      <p class="empty-msg">Upload an image (same pixel size as the calibration data) to see the blue design area, orange perforation teeth, and the green adjustable path.</p>
    </div>
  </main>

  <script>
    const DEFAULT_DATA = {
      design_corners: {
        "bottom-left": [203, 1237],
        "bottom-right": [1862, 1236],
        "top-left": [197, 190],
        "top-right": [1840, 172],
      },
      perforation_corners: {
        "bottom-left": [181, 1247],
        "bottom-right": [1848, 1239],
        "left-bottom": [122, 1220],
        "left-top": [122, 160],
        "right-bottom": [1914, 1246],
        "right-top": [1906, 214],
        "top-left": [180, 123],
        "top-right": [1839, 113],
      },
      perforations: { bottom: 13.14, left: 12.92, right: 13.27, top: 13.21 },
      processed_id: "20530d42-d6fb-42c0-b4fb-71ead5609939",
      px_per_mm: 45.642,
      success: true,
    };

    /** Ordered perimeter: top-left → … → back to top-left */
    const PERF_ORDER = [
      ["top-left", "top-right", "top"],
      ["top-right", "right-top", "right"],
      ["right-top", "right-bottom", "right"],
      ["right-bottom", "bottom-right", "right"],
      ["bottom-right", "bottom-left", "bottom"],
      ["bottom-left", "left-bottom", "left"],
      ["left-bottom", "left-top", "left"],
      ["left-top", "top-left", "left"],
    ];

    function designPolygon(data) {
      const d = data.design_corners;
      return [
        d["top-left"],
        d["top-right"],
        d["bottom-right"],
        d["bottom-left"],
      ];
    }

    function pointInPolygon(x, y, poly) {
      let inside = false;
      for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
        const xi = poly[i][0], yi = poly[i][1];
        const xj = poly[j][0], yj = poly[j][1];
        const intersect = yi > y !== yj > y && x < ((xj - xi) * (y - yi)) / (yj - yi + 1e-12) + xi;
        if (intersect) inside = !inside;
      }
      return inside;
    }

    function quadContainsQuad(blue, pts) {
      return pts.every((p) => pointInPolygon(p[0], p[1], blue));
    }

    function dist(a, b) {
      return Math.hypot(b[0] - a[0], b[1] - a[1]);
    }

    /** Anchor endpoints a,b; fill with steps of spacingPx (image px). */
    function teethAlongSegment(a, b, spacingPx) {
      const len = dist(a, b);
      if (len < 1e-6) return [[a[0], a[1]]];
      const ux = (b[0] - a[0]) / len;
      const uy = (b[1] - a[1]) / len;
      const out = [[a[0], a[1]]];
      let d = spacingPx;
      while (d < len - 0.25) {
        out.push([a[0] + ux * d, a[1] + uy * d]);
        d += spacingPx;
      }
      const last = out[out.length - 1];
      if (dist(last, b) > 0.5) out.push([b[0], b[1]]);
      return out;
    }

    function buildPerforationPath(data) {
      const pc = data.perforation_corners;
      const ppm = data.px_per_mm;
      const perf = data.perforations;
      const segments = [];
      for (const [k0, k1, side] of PERF_ORDER) {
        const a = pc[k0];
        const b = pc[k1];
        const spacingMm = perf[side];
        const spacingPx = spacingMm * ppm;
        const part = teethAlongSegment(a, b, spacingPx);
        if (segments.length && part.length) {
          const prev = segments[segments.length - 1];
          const first = part[0];
          if (dist(prev[prev.length - 1], first) < 0.5) part.shift();
        }
        segments.push(part);
      }
      const flat = segments.flat();
      return flat;
    }

    function boundsOfPoints(pts) {
      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      for (const [x, y] of pts) {
        minX = Math.min(minX, x);
        minY = Math.min(minY, y);
        maxX = Math.max(maxX, x);
        maxY = Math.max(maxY, y);
      }
      return { minX, minY, maxX, maxY, w: maxX - minX, h: maxY - minY };
    }

    /** Axis-aligned rect as { x, y, w, h } (top-left, size). */
    function rectCorners(r) {
      return [
        [r.x, r.y],
        [r.x + r.w, r.y],
        [r.x + r.w, r.y + r.h],
        [r.x, r.y + r.h],
      ];
    }

    function clampRectInsideQuad(rect, blue, data) {
      const perf = data.perforations;
      const ppm = data.px_per_mm;
      const minSide = Math.min(
          perf.top * ppm,
          perf.bottom * ppm,
          perf.left * ppm,
          perf.right * ppm
      ) * 2;

      let { x, y, w, h } = rect;
      const bb = boundsOfPoints(blue);
      const cx0 = bb.minX + (bb.maxX - bb.minX) / 2;
      const cy0 = bb.minY + (bb.maxY - bb.minY) / 2;

      w = Math.max(minSide, Math.min(w, bb.maxX - bb.minX));
      h = Math.max(minSide, Math.min(h, bb.maxY - bb.minY));
      x = Math.max(bb.minX, Math.min(x, bb.maxX - w));
      y = Math.max(bb.minY, Math.min(y, bb.maxY - h));

      let r = { x, y, w, h };

      if (!quadContainsQuad(blue, rectCorners(r))) {
        let lo = 0.05;
        let hi = 1;
        for (let i = 0; i < 24; i++) {
          const mid = (lo + hi) / 2;
          const rw = Math.max(minSide, (bb.maxX - bb.minX) * mid);
          const rh = Math.max(minSide, (bb.maxY - bb.minY) * mid);
          r = { x: cx0 - rw / 2, y: cy0 - rh / 2, w: rw, h: rh };
          if (quadContainsQuad(blue, rectCorners(r))) lo = mid;
          else hi = mid;
        }
        const rw = Math.max(minSide, (bb.maxX - bb.minX) * lo);
        const rh = Math.max(minSide, (bb.maxY - bb.minY) * lo);
        r = { x: cx0 - rw / 2, y: cy0 - rh / 2, w: rw, h: rh };
      }

      if (!quadContainsQuad(blue, rectCorners(r))) {
        const rw = Math.max(minSide, (bb.maxX - bb.minX) * 0.5);
        const rh = Math.max(minSide, (bb.maxY - bb.minY) * 0.5);
        r = { x: cx0 - rw / 2, y: cy0 - rh / 2, w: rw, h: rh };
      }

      return r;
    }

    function teethOnRect(r, data) {
      const perf = data.perforations;
      const ppm = data.px_per_mm;
      const tl = [r.x, r.y];
      const tr = [r.x + r.w, r.y];
      const br = [r.x + r.w, r.y + r.h];
      const bl = [r.x, r.y + r.h];
      const parts = [
        teethAlongSegment(tl, tr, perf.top * ppm),
        teethAlongSegment(tr, br, perf.right * ppm),
        teethAlongSegment(br, bl, perf.bottom * ppm),
        teethAlongSegment(bl, tl, perf.left * ppm),
      ];
      const flat = [];
      for (let i = 0; i < parts.length; i++) {
        const p = parts[i];
        if (flat.length && p.length) {
          const L = flat[flat.length - 1];
          const f = p[0];
          if (dist(L, f) < 0.5) p.shift();
        }
        flat.push(...p);
      }
      return flat;
    }

    class Editor {
      constructor(container) {
        this.container = container;
        this.data = JSON.parse(JSON.stringify(DEFAULT_DATA));
        this.image = null;
        this.scale = 1;
        this.blue = designPolygon(this.data);
        this.perfPath = buildPerforationPath(this.data);
        const b = boundsOfPoints(this.perfPath);
        const pad = 20;
        this.greenRect = clampRectInsideQuad(
          { x: b.minX + pad, y: b.minY + pad, w: b.w - 2 * pad, h: b.h - 2 * pad },
          this.blue,
          this.data
        );
        this.drag = null;
        this.setupDom();
      }

      setupDom() {
        this.container.innerHTML = "";
        const wrap = document.createElement("div");
        wrap.className = "wrap";
        this.canvas = document.createElement("canvas");
        this.canvas.id = "viewport";
        wrap.appendChild(this.canvas);
        this.container.appendChild(wrap);
        this.ctx = this.canvas.getContext("2d");

        this.canvas.addEventListener("mousemove", (e) => this.onMove(e));
        this.canvas.addEventListener("mouseleave", () => {
          document.getElementById("coords").textContent = "x: — , y: —";
        });
        this.canvas.addEventListener("mousedown", (e) => this.onDown(e));
        window.addEventListener("mousemove", (e) => this.onWindowMove(e));
        window.addEventListener("mouseup", () => this.onUp());
        window.addEventListener("resize", () => this.layout());
      }

      setImage(img) {
        this.image = img;
        this.layout();
        this.draw();
      }

      layout() {
        if (!this.image) return;
        const maxW = Math.min(this.image.naturalWidth, Math.max(320, window.innerWidth - 48));
        this.scale = maxW / this.image.naturalWidth;
        this.canvas.width = this.image.naturalWidth;
        this.canvas.height = this.image.naturalHeight;
        this.canvas.style.width = `${this.image.naturalWidth * this.scale}px`;
        this.canvas.style.height = `${this.image.naturalHeight * this.scale}px`;
      }

      imageToCanvas(clientX, clientY) {
        const rect = this.canvas.getBoundingClientRect();
        const ix = (clientX - rect.left) / this.scale;
        const iy = (clientY - rect.top) / this.scale;
        return { ix, iy };
      }

      onMove(e) {
        const { ix, iy } = this.imageToCanvas(e.clientX, e.clientY);
        document.getElementById("coords").textContent =
          `x: ${ix.toFixed(1)} , y: ${iy.toFixed(1)}`;
      }

      hitGreenHandle(ix, iy, r) {
        const h = 14 / this.scale;
        const corners = rectCorners(r);
        for (let i = 0; i < 4; i++) {
          const [cx, cy] = corners[i];
          if (Math.abs(ix - cx) <= h && Math.abs(iy - cy) <= h) return { type: "corner", i };
        }
        if (
          ix >= r.x &&
          ix <= r.x + r.w &&
          iy >= r.y &&
          iy <= r.y + r.h &&
          pointInPolygon(ix, iy, this.blue)
        ) {
          return { type: "move" };
        }
        return null;
      }

      onDown(e) {
        if (!this.image) return;
        const { ix, iy } = this.imageToCanvas(e.clientX, e.clientY);
        const hit = this.hitGreenHandle(ix, iy, this.greenRect);
        if (hit) {
          this.drag = {
            kind: hit.type,
            corner: hit.i,
            startIx: ix,
            startIy: iy,
            startRect: { ...this.greenRect },
          };
        }
      }

      onWindowMove(e) {
        if (!this.drag || !this.image) return;
        const { ix, iy } = this.imageToCanvas(e.clientX, e.clientY);
        const dx = ix - this.drag.startIx;
        const dy = iy - this.drag.startIy;
        const sr = this.drag.startRect;
        let r = { ...sr };

        if (this.drag.kind === "move") {
          r.x = sr.x + dx;
          r.y = sr.y + dy;
          r = clampRectInsideQuad(r, this.blue, this.data);
        } else if (this.drag.kind === "corner") {
          const ci = this.drag.corner;
          if (ci === 0) {
            r.x = sr.x + dx;
            r.y = sr.y + dy;
            r.w = sr.w - dx;
            r.h = sr.h - dy;
          } else if (ci === 1) {
            r.y = sr.y + dy;
            r.w = sr.w + dx;
            r.h = sr.h - dy;
          } else if (ci === 2) {
            r.w = sr.w + dx;
            r.h = sr.h + dy;
          } else {
            r.x = sr.x + dx;
            r.w = sr.w - dx;
            r.h = sr.h + dy;
          }
          if (r.w < 0) {
            r.x += r.w;
            r.w = -r.w;
            this.drag.corner ^= 1;
          }
          if (r.h < 0) {
            r.y += r.h;
            r.h = -r.h;
            this.drag.corner ^= 2;
          }
          r = clampRectInsideQuad(r, this.blue, this.data);
        }

        this.greenRect = r;
        this.draw();
      }

      onUp() {
        this.drag = null;
      }

      draw() {
        const ctx = this.ctx;
        const w = this.canvas.width;
        const h = this.canvas.height;
        ctx.clearRect(0, 0, w, h);
        if (!this.image) return;

        ctx.drawImage(this.image, 0, 0);

        const blue = this.blue;
        ctx.beginPath();
        ctx.moveTo(blue[0][0], blue[0][1]);
        for (let i = 1; i < blue.length; i++) ctx.lineTo(blue[i][0], blue[i][1]);
        ctx.closePath();
        ctx.strokeStyle = "rgba(59, 130, 246, 0.95)";
        ctx.lineWidth = 3;
        ctx.stroke();
        ctx.fillStyle = "rgba(59, 130, 246, 0.06)";
        ctx.fill();

        const perfPts = this.perfPath;
        ctx.fillStyle = "rgba(249, 115, 22, 0.95)";
        for (const [px, py] of perfPts) {
          ctx.beginPath();
          ctx.arc(px, py, 5, 0, Math.PI * 2);
          ctx.fill();
        }

        const gr = this.greenRect;
        const greenTeeth = teethOnRect(gr, this.data);
        ctx.beginPath();
        ctx.moveTo(greenTeeth[0][0], greenTeeth[0][1]);
        for (let i = 1; i < greenTeeth.length; i++) {
          ctx.lineTo(greenTeeth[i][0], greenTeeth[i][1]);
        }
        ctx.closePath();
        ctx.strokeStyle = "rgba(34, 197, 94, 0.95)";
        ctx.lineWidth = 2.5;
        ctx.stroke();

        ctx.fillStyle = "rgba(34, 197, 94, 0.9)";
        for (const [px, py] of greenTeeth) {
          ctx.beginPath();
          ctx.arc(px, py, 3.5, 0, Math.PI * 2);
          ctx.fill();
        }

        const corners = rectCorners(gr);
        ctx.fillStyle = "rgba(34, 197, 94, 1)";
        for (const [cx, cy] of corners) {
          ctx.beginPath();
          ctx.arc(cx, cy, 7, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }

    const mainInner = document.getElementById("main-inner");
    let editor = null;

    document.getElementById("file").addEventListener("change", (e) => {
      const f = e.target.files && e.target.files[0];
      if (!f) return;
      const url = URL.createObjectURL(f);
      const img = new Image();
      img.onload = () => {
        URL.revokeObjectURL(url);
        if (!editor) {
          mainInner.innerHTML = "";
          editor = new Editor(mainInner);
        }
        editor.setImage(img);
      };
      img.onerror = () => URL.revokeObjectURL(url);
      img.src = url;
    });
  </script>
</body>
</html>
